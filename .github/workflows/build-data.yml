name: Build flood data

on:
  workflow_dispatch:
    inputs:
      max_fetch:
        description: "Max Stage IV files to download this run (reruns resume from cache)"
        default: "25000"
  schedule:
    - cron: "17 9 3 * *"   # monthly, 3rd at 09:17 UTC
  push:
    paths:
      - "scripts/build_data.py"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests numpy pygrib

      - name: Build dataset
        env:
          MAX_FETCH: ${{ github.event.inputs.max_fetch || '25000' }}
          WORKERS: "6"
        run: python scripts/build_data.py

      - name: Commit data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/flood_hotspots.json data/stage4 || true
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update flood hot-spot data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash || true
            git push
          fi
