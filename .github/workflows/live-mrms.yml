name: Live MRMS

# Pulls the latest MRMS QPE grids every ~10 min and force-pushes them to an
# orphan branch "live" (single commit, so history never grows). The page reads
# https://raw.githubusercontent.com/<owner>/<repo>/live/mrms_latest.json
# GitHub can delay scheduled runs; the page shows the data age.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: live-mrms
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/live_mrms.py

      - name: Install deps
        run: pip install requests numpy pygrib

      - name: Fetch MRMS
        env:
          LIVE_OUT: ${{ runner.temp }}/live
        run: python scripts/live_mrms.py

      - name: Publish to live branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ runner.temp }}/live"
          git init -q -b live
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add mrms_latest.json
          git commit -q -m "MRMS $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live
